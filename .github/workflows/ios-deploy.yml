name: 🚀 Build & Deploy iOS (Signed)

on:
  push:
    tags:
      - 'v*.*.*'           # Chạy khi push tag: git tag v1.0.0 && git push --tags
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - adhoc
      build_name:
        description: 'Version name (e.g. 1.2.0)'
        required: false
        default: '1.0.0'

# Chỉ 1 deploy chạy cùng lúc
concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-ios:
    name: 🔏 Build Signed IPA & Deploy
    runs-on: macos-15
    timeout-minutes: 90

    env:
      FLUTTER_APP_DIR: 'app_web_view (1)'
      BUILD_NAME: ${{ github.event.inputs.build_name || github.ref_name || '1.0.0' }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. Flutter ─────────────────────────────────────────────
      - name: 🐦 Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Configure Flutter flags
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --enable-native-assets 2>/dev/null || true

      # ── 3. Import Certificate & Provisioning Profile ───────────
      # Thêm các secrets vào GitHub repo:
      #   Settings → Secrets and variables → Actions → New repository secret
      #
      # ┌─────────────────────────────────────────────────────────┐
      # │ SECRET NAME                │ Cách lấy                   │
      # ├─────────────────────────────────────────────────────────┤
      # │ IOS_CERTIFICATE_BASE64     │ base64 < YourCert.p12      │
      # │ IOS_CERTIFICATE_PASSWORD   │ Password của file .p12     │
      # │ IOS_PROVISION_PROFILE_BASE64│ base64 < profile.mobileprovision │
      # │ KEYCHAIN_PASSWORD          │ Chuỗi bất kỳ (tạm)        │
      # │ APPSTORE_ISSUER_ID         │ App Store Connect → Keys   │
      # │ APPSTORE_API_KEY_ID        │ App Store Connect → Keys   │
      # │ APPSTORE_API_PRIVATE_KEY   │ Nội dung file .p8          │
      # └─────────────────────────────────────────────────────────┘

      - name: 🔐 Import code signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Tạo keychain tạm
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate .p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Cài provisioning profile
          PP_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_DIR"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_DIR/profile.mobileprovision"

          # Lấy UUID của profile để confirm
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" \
            /dev/stdin <<< $(security cms -D -i "$PP_DIR/profile.mobileprovision"))
          echo "✅ Profile UUID: $UUID"

          # Dọn dẹp
          rm /tmp/certificate.p12

      # ── 4. Cache pub ───────────────────────────────────────────
      - name: 📦 Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.FLUTTER_APP_DIR }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: 📦 Flutter pub get
        working-directory: ${{ env.FLUTTER_APP_DIR }}
        run: flutter pub get

      # ── 5. Generate app icons ──────────────────────────────────
      - name: 🎨 Generate launcher icons
        working-directory: ${{ env.FLUTTER_APP_DIR }}
        run: dart run flutter_launcher_icons
        continue-on-error: true

      # ── 6. CocoaPods ───────────────────────────────────────────
      - name: 📦 Cache CocoaPods
        uses: actions/cache@v4
        id: cocoapods-cache
        with:
          path: |
            ${{ env.FLUTTER_APP_DIR }}/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: 🍫 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: 🍫 Pod install
        working-directory: ${{ env.FLUTTER_APP_DIR }}/ios
        run: |
          if [ "${{ steps.cocoapods-cache.outputs.cache-hit }}" == "true" ]; then
            pod install
          else
            pod install --repo-update
          fi

      # ── 7. Build IPA (signed) ──────────────────────────────────
      - name: 🔨 Build signed IPA
        working-directory: ${{ env.FLUTTER_APP_DIR }}
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name="${{ env.BUILD_NAME }}" \
            --build-number=${{ github.run_number }}

      # ── 8. Upload artifact ─────────────────────────────────────
      - name: ⬆️ Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Screenplay_Signed_${{ github.run_number }}
          path: ${{ env.FLUTTER_APP_DIR }}/build/ios/ipa/*.ipa
          retention-days: 30

      # ── 9. Upload lên TestFlight ──────────────────────────────
      - name: 🚀 Upload to TestFlight
        if: ${{ github.event.inputs.environment == 'testflight' || startsWith(github.ref, 'refs/tags/') }}
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.FLUTTER_APP_DIR }}/build/ios/ipa/app_web_view.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      # ── 10. Summary ────────────────────────────────────────────
      - name: 📊 Deploy summary
        if: always()
        run: |
          echo "## 🚀 iOS Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ env.BUILD_NAME }}+${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | ${{ github.event.inputs.environment || 'testflight (tag trigger)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
