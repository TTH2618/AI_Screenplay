name: 🍎 Build iOS (Flutter)

on:
  push:
    branches: [main, master]
    paths:
      - 'app_web_view (1)/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'app_web_view (1)/**'
  workflow_dispatch: # Chạy thủ công từ GitHub UI → Actions tab

# Chỉ cho phép 1 run trên cùng branch (tự cancel run cũ)
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 🔨 Build iOS IPA (unsigned)
    runs-on: macos-14          # Xcode 15.x – ổn định hơn với các plugin CocoaPods
    timeout-minutes: 60

    env:
      FLUTTER_APP_DIR: 'app_web_view (1)'

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Flutter ─────────────────────────────────────────
      - name: 🐦 Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true           # Cache Flutter SDK giữa các runs

      - name: 📋 Flutter version info
        run: flutter --version

      # ── 2b. Cấu hình Flutter ─────────────────────────────────────
      # objective_c (transitive dep của flutter_web_auth_2) YÊU CẦU native-assets.
      # native-assets phải ĐƯỢC BẬT. Lỗi null-crash trước chỉ xảy ra trên
      # macos-15 (Xcode 16) nên ta dùng macos-14 (Xcode 15) + native-assets ON.
      - name: ⚙️ Configure Flutter flags
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --enable-native-assets 2>/dev/null || true
          flutter config --enable-dart-data-assets 2>/dev/null || true

      # ── 3. Cache pub packages ────────────────────────────────────
      - name: 📦 Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.FLUTTER_APP_DIR }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # ── 4. Flutter pub get ───────────────────────────────────────
      - name: 📦 Flutter pub get
        working-directory: ${{ env.FLUTTER_APP_DIR }}
        run: flutter pub get

      # ── 5. Generate app icons ────────────────────────────────────
      - name: 🎨 Generate launcher icons
        working-directory: ${{ env.FLUTTER_APP_DIR }}
        run: dart run flutter_launcher_icons
        continue-on-error: true

      # ── 6. Cache CocoaPods ───────────────────────────────────────
      - name: 📦 Cache CocoaPods
        uses: actions/cache@v4
        id: cocoapods-cache
        with:
          path: |
            ${{ env.FLUTTER_APP_DIR }}/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      # ── 7. Setup CocoaPods ───────────────────────────────────────
      - name: 🍫 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: 🍫 Pod install
        working-directory: ${{ env.FLUTTER_APP_DIR }}/ios
        run: |
          # Luôn chạy repo-update lần đầu sau khi sửa Podfile
          # post_install block mới cần pod install fresh để có hiệu lực
          pod install --repo-update

      # ── 8. Verify code signing is disabled ───────────────────────
      - name: 🔐 Verify code signing disabled
        working-directory: ${{ env.FLUTTER_APP_DIR }}
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          if grep -q 'CODE_SIGNING_ALLOWED = NO' "$PBXPROJ"; then
            echo "✅ Code signing already disabled"
          else
            echo "⚠️ Patching project.pbxproj..."
            ruby - <<'RUBY'
              path = 'ios/Runner.xcodeproj/project.pbxproj'
              content = File.read(path)
              content.gsub!(/DEVELOPMENT_TEAM = [^;]*;/, 'DEVELOPMENT_TEAM = "FAKETEAM00";')
              content.gsub!(/CODE_SIGNING_REQUIRED = YES;/, 'CODE_SIGNING_REQUIRED = NO;')
              content.gsub!(/CODE_SIGNING_ALLOWED = YES;/, 'CODE_SIGNING_ALLOWED = NO;')
              File.write(path, content)
              puts '✅ Patched.'
          RUBY
          fi

      # ── 9. Build iOS (no codesign) ──────────────────────────────────
      - name: 🔨 Build iOS release (no codesign)
        working-directory: ${{ env.FLUTTER_APP_DIR }}
        run: |
          set +e
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }} 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          RUNNER_APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$RUNNER_APP" ]; then
            echo "" 
            echo "=== ❌ BUILD FAILED – Last 200 lines of build log: ==="
            tail -200 /tmp/flutter_build.log || true
            echo "==================================================="
            echo "❌ Runner.app không tồn tại – Xcode build thất bại! (exit=$BUILD_EXIT)"
            exit 1
          fi
          echo "✅ Runner.app OK – size: $(du -sh "$RUNNER_APP" | cut -f1) | flutter exit=$BUILD_EXIT"

      # ── 10. Đóng gói IPA (unsigned) ──────────────────────────────
      - name: 📦 Create unsigned IPA
        working-directory: ${{ env.FLUTTER_APP_DIR }}
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr AI_Screenplay_unsigned.ipa Payload/
          rm -rf Payload/
          echo "✅ IPA: $(du -sh AI_Screenplay_unsigned.ipa | cut -f1)"

      # ── 11. Upload artifact ──────────────────────────────────────
      - name: ⬆️ Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Screenplay_iOS_${{ github.run_number }}
          path: ${{ env.FLUTTER_APP_DIR }}/AI_Screenplay_unsigned.ipa
          retention-days: 14

      # ── 12. Build summary ────────────────────────────────────────
      - name: 📊 Build summary
        if: always()
        run: |
          echo "## 🍎 iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Run #** | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **macOS runner** | macos-14 (Xcode 15) |" >> $GITHUB_STEP_SUMMARY
          echo "| **IPA** | AI_Screenplay_iOS_${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY

      # ── 13. (Tùy chọn) Upload lên TestFlight ─────────────────────
      # Bỏ comment khi đã có Apple credentials trong GitHub Secrets:
      #   IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD,
      #   IOS_PROVISION_PROFILE_BASE64, KEYCHAIN_PASSWORD,
      #   APPSTORE_ISSUER_ID, APPSTORE_API_KEY_ID, APPSTORE_API_PRIVATE_KEY
      #
      # - name: 🚀 Upload to TestFlight
      #   uses: apple-actions/upload-testflight-build@v1
      #   with:
      #     app-path: ${{ env.FLUTTER_APP_DIR }}/AI_Screenplay_unsigned.ipa
      #     issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
      #     api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
      #     api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
