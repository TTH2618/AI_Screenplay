# Flutter version: 3.44.0 (Dart SDK 3.10.x) - required by pubspec sdk: ^3.10.7
name: 🍎 iOS Build - AI Screenplay

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'app_web_view (1)/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'app_web_view (1)/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại build'
        required: true
        default: 'simulator'
        type: choice
        options:
          - simulator
          - device-unsigned

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build iOS (Simulator / No-codesign)
  # ─────────────────────────────────────────
  build-ios:
    name: 🔨 Build Flutter iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout source code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter
      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      # 3. Xem phiên bản Flutter
      - name: ℹ️ Flutter version info
        run: flutter --version

      # 4. Lấy dependencies
      - name: 📦 Get Flutter dependencies
        working-directory: 'app_web_view (1)'
        run: flutter pub get

      # 5. Phân tích code (lint check)
      - name: 🔍 Analyze code
        working-directory: 'app_web_view (1)'
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 6. Chạy tests
      - name: 🧪 Run unit tests
        working-directory: 'app_web_view (1)'
        run: flutter test --reporter=expanded
        continue-on-error: true

      # 7. Build iOS cho Simulator (không cần code signing)
      - name: 🏗️ Build iOS (Simulator - no codesign)
        working-directory: 'app_web_view (1)'
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --verbose
        env:
          FLUTTER_BUILD_NUMBER: ${{ github.run_number }}

      # 8. Tạo thư mục output
      - name: 📁 Prepare output directory
        run: mkdir -p output

      # 9. Đóng gói app bundle
      - name: 📦 Package .app bundle
        working-directory: 'app_web_view (1)'
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "⚠️ Không tìm thấy .app trong iphoneos, thử simulator..."
            APP_PATH=$(find build/ios -name "*.app" -type d | head -1)
          fi
          echo "📱 App path: $APP_PATH"
          
          # Copy sang output
          cp -r "$APP_PATH" ../output/AIScreenplay.app
          
          # Tạo payload folder để đóng gói IPA (unsigned)
          mkdir -p ../output/Payload
          cp -r "$APP_PATH" ../output/Payload/Runner.app
          
          # Tạo IPA (unsigned - chỉ để test/sideload)
          cd ../output
          zip -r AIScreenplay_unsigned.ipa Payload/
          rm -rf Payload
          
          echo "✅ Đóng gói thành công!"
          ls -lah .

      # 10. Upload artifact - IPA file
      - name: ⬆️ Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIScreenplay-iOS-${{ github.run_number }}
          path: |
            output/AIScreenplay_unsigned.ipa
            output/AIScreenplay.app
          retention-days: 30
          if-no-files-found: warn

      # 11. Upload build logs nếu thất bại
      - name: ⬆️ Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            'app_web_view (1)/build/ios/
          retention-days: 7

      # 12. Summary
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🍎 iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Thông tin | Giá trị |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Number** | \`${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runner** | \`${{ runner.os }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Flutter** | 3.32.0 stable |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **AIScreenplay_unsigned.ipa** - Cài bằng AltStore/Sideloadly (không qua App Store)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ **Lưu ý**: IPA này là **unsigned** (không có certificate Apple). Để cài lên thiết bị thật cần code signing." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Build với Code Signing (chỉ chạy khi có secrets)
  # Yêu cầu thêm secrets vào GitHub repo settings:
  #   - IOS_CERTIFICATE_BASE64    : Certificate .p12 encode base64
  #   - IOS_CERTIFICATE_PASSWORD  : Password của .p12
  #   - IOS_PROVISIONING_PROFILE  : Provisioning profile encode base64
  #   - KEYCHAIN_PASSWORD         : Mật khẩu keychain tạm thời
  # ─────────────────────────────────────────────────────────────────
  build-ios-signed:
    name: 🔐 Build Flutter iOS (Signed)
    runs-on: macos-latest
    timeout-minutes: 60
    # Chỉ chạy khi bật biến ENABLE_SIGNED_BUILD = 'true' trong repo Settings > Variables
    # (secrets.* không được phép dùng trong job-level if condition)
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.ENABLE_SIGNED_BUILD == 'true'
    needs: build-ios

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get Flutter dependencies
        working-directory: 'app_web_view (1)'
        run: flutter pub get

      # Import certificate vào Keychain
      - name: 🔑 Import Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Tạo keychain tạm
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12

      # Cài provisioning profile
      - name: 📋 Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          
          # Tạo thư mục provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # Lấy UUID của profile
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          echo "Profile UUID: $UUID"
          
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      # Build IPA có ký
      - name: 🏗️ Build iOS IPA (Signed)
        working-directory: 'app_web_view (1)'
        run: |
          flutter build ipa \
            --release \
            --export-method ad-hoc \
            --verbose
        env:
          FLUTTER_BUILD_NUMBER: ${{ github.run_number }}

      # Upload IPA đã ký
      - name: ⬆️ Upload Signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: AIScreenplay-iOS-Signed-${{ github.run_number }}
          path: 'app_web_view (1)/build/ios/ipa/*.ipa'
          retention-days: 30
          if-no-files-found: error

      # Dọn dẹp keychain
      - name: 🧹 Cleanup Keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
