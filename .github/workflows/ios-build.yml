name: Build iOS (Flutter)

on:
  push:
    branches: [main, master]
    paths:
      - 'app_web_view (1)/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'app_web_view (1)/**'
  workflow_dispatch: # Cho phép chạy thủ công từ GitHub UI

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout code ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Cài Flutter SDK ─────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      # ── 2b. Tắt SPM → dùng CocoaPods only, tránh SPM+native-assets crash ─────
      - name: Disable Swift Package Manager (CocoaPods only)
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --enable-native-assets
          flutter config --enable-dart-data-assets || true

      # ── 3. Lấy dependencies ────────────────────────────────────
      - name: Flutter pub get
        working-directory: 'app_web_view (1)'
        run: flutter pub get

      # ── 4. Cài CocoaPods dependencies ─────────────────────────
      - name: Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: Pod install
        working-directory: 'app_web_view (1)/ios'
        run: pod install --repo-update

      # ── 5. (Tùy chọn) Generate app icons ─────────────────────
      - name: Generate launcher icons
        working-directory: 'app_web_view (1)'
        run: flutter pub run flutter_launcher_icons
        continue-on-error: true

      # ── 6. Xác nhận code signing đã bị tắt trong project.pbxproj ────────────
      - name: Verify code signing disabled in Xcode project
        working-directory: 'app_web_view (1)'
        run: |
          if grep -q 'DEVELOPMENT_TEAM = "FAKETEAM00"' ios/Runner.xcodeproj/project.pbxproj; then
            echo "✅ CODE_SIGNING_ALLOWED=NO and DEVELOPMENT_TEAM=FAKETEAM00 already set in project.pbxproj"
          else
            echo "⚠️ Patching project.pbxproj..."
            ruby -e "
              path = 'ios/Runner.xcodeproj/project.pbxproj'
              content = File.read(path)
              # Replace empty/missing DEVELOPMENT_TEAM with dummy value
              content.gsub!(/DEVELOPMENT_TEAM = [^;]*;/, 'DEVELOPMENT_TEAM = \"FAKETEAM00\";')
              # Replace YES signing required with NO
              content.gsub!(/CODE_SIGNING_REQUIRED = YES;/, 'CODE_SIGNING_REQUIRED = NO;')
              content.gsub!(/CODE_SIGNING_ALLOWED = YES;/, 'CODE_SIGNING_ALLOWED = NO;')
              File.write(path, content)
              puts 'Patched.'
            "
          fi

      # ── 7. Build iOS (không cần code signing) ─────────────────
      # Flutter 3.44.x: Xcode build thành công nhưng Flutter post-check
      # yêu cầu Development Team dù có --no-codesign. Dùng || true để
      # bỏ qua exit code, rồi verify Runner.app thực sự tồn tại.
      - name: Build iOS (no codesign)
        working-directory: 'app_web_view (1)'
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

          # Verify Runner.app was actually built by Xcode
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "❌ Runner.app not found - Xcode build actually failed!"
            exit 1
          fi
          echo "✅ Runner.app built successfully at build/ios/iphoneos/Runner.app"

      # ── 8. Đóng gói thành IPA (unsigned) ──────────────────────
      - name: Create unsigned IPA
        working-directory: 'app_web_view (1)'
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AI_Screenplay_unsigned.ipa Payload/
          rm -rf Payload/

      # ── 9. Upload artifact ───────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Screenplay_iOS_${{ github.run_number }}
          path: 'app_web_view (1)/AI_Screenplay_unsigned.ipa'
          retention-days: 14

      # ── 9. (Tùy chọn) Upload lên TestFlight ──────────────────
      # Bỏ comment khi đã có Apple credentials
      # - name: Upload to TestFlight
      #   uses: apple-actions/upload-testflight-build@v1
      #   with:
      #     app-path: 'app_web_view (1)/AI_Screenplay_unsigned.ipa'
      #     issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
      #     api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
      #     api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
