name: Build iOS (Flutter)

on:
  push:
    branches: [main, master]
    paths:
      - 'app_web_view (1)/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'app_web_view (1)/**'
  workflow_dispatch: # Cho phép chạy thủ công từ GitHub UI

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout code ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Cài Flutter SDK ─────────────────────────────────────
      # Không pin cứng flutter-version để tránh lỗi "version not found".
      # subosito/flutter-action sẽ lấy bản stable mới nhất.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      # ── 2b. Tắt SPM → dùng CocoaPods only ─────────────────────
      # objective_c package yêu cầu native-assets; SPM+native-assets gây
      # crash "JNI parseOtoolArchitectureSections" trên CI.
      - name: Configure Flutter (disable SPM, keep native-assets)
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --enable-native-assets || true
          flutter config --enable-dart-data-assets || true

      # ── 3. Lấy dependencies ────────────────────────────────────
      - name: Flutter pub get
        working-directory: 'app_web_view (1)'
        run: flutter pub get

      # ── 4. Cài CocoaPods dependencies ─────────────────────────
      - name: Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: Pod install
        working-directory: 'app_web_view (1)/ios'
        run: pod install --repo-update

      # ── 5. (Tùy chọn) Generate app icons ─────────────────────
      - name: Generate launcher icons
        working-directory: 'app_web_view (1)'
        run: dart run flutter_launcher_icons
        continue-on-error: true

      # ── 6. Đảm bảo code signing đã tắt trong project.pbxproj ─
      - name: Ensure code signing is disabled
        working-directory: 'app_web_view (1)'
        run: |
          if grep -q 'CODE_SIGNING_ALLOWED = NO' ios/Runner.xcodeproj/project.pbxproj; then
            echo "✅ Code signing already disabled in project.pbxproj"
          else
            echo "⚠️ Patching project.pbxproj to disable code signing..."
            ruby -e "
              path = 'ios/Runner.xcodeproj/project.pbxproj'
              content = File.read(path)
              content.gsub!(/DEVELOPMENT_TEAM = [^;]*;/, 'DEVELOPMENT_TEAM = \"FAKETEAM00\";')
              content.gsub!(/CODE_SIGNING_REQUIRED = YES;/, 'CODE_SIGNING_REQUIRED = NO;')
              content.gsub!(/CODE_SIGNING_ALLOWED = YES;/, 'CODE_SIGNING_ALLOWED = NO;')
              File.write(path, content)
              puts 'Patched.'
            "
          fi

      # ── 7. Build iOS (không cần code signing) ─────────────────
      # Flutter post-build signing check đôi khi exit non-zero dù Xcode
      # đã build thành công. Dùng BUILD_EXIT_CODE để capture rồi tự verify.
      - name: Build iOS (no codesign)
        working-directory: 'app_web_view (1)'
        run: |
          set +e
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}
          BUILD_EXIT_CODE=$?
          set -e

          # Verify Runner.app thực sự được tạo bởi Xcode
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "❌ Runner.app không tồn tại - Xcode build thực sự thất bại! (exit code: $BUILD_EXIT_CODE)"
            exit 1
          fi

          echo "✅ Runner.app built at build/ios/iphoneos/Runner.app (flutter exit: $BUILD_EXIT_CODE)"

      # ── 8. Đóng gói thành IPA (unsigned) ──────────────────────
      - name: Create unsigned IPA
        working-directory: 'app_web_view (1)'
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AI_Screenplay_unsigned.ipa Payload/
          rm -rf Payload/
          echo "✅ IPA created: AI_Screenplay_unsigned.ipa ($(du -sh AI_Screenplay_unsigned.ipa | cut -f1))"

      # ── 9. Upload artifact ────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Screenplay_iOS_${{ github.run_number }}
          path: 'app_web_view (1)/AI_Screenplay_unsigned.ipa'
          retention-days: 14

      # ── 10. (Tùy chọn) Upload lên TestFlight ─────────────────
      # Bỏ comment khi đã có Apple credentials trong GitHub Secrets:
      # IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD,
      # IOS_PROVISION_PROFILE_BASE64, KEYCHAIN_PASSWORD,
      # APPSTORE_ISSUER_ID, APPSTORE_API_KEY_ID, APPSTORE_API_PRIVATE_KEY
      # - name: Upload to TestFlight
      #   uses: apple-actions/upload-testflight-build@v1
      #   with:
      #     app-path: 'app_web_view (1)/AI_Screenplay_unsigned.ipa'
      #     issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
      #     api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
      #     api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
