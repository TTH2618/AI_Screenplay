name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:   # cho phép chạy thủ công trên GitHub

jobs:
  build-ios:
    runs-on: macos-latest   # GitHub cung cấp máy Mac miễn phí

    steps:
      # ── 1. Lấy code từ repo ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Cài Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Cài Capacitor (npm install) ───────────────────────────────────
      - name: Install Capacitor dependencies
        run: npm install

      # ── 4. Tạo thư mục www/ và copy web assets vào đó ───────────────────
      - name: Prepare www assets
        run: |
          mkdir -p www
          for item in css js icons manifest.json sw.js \
                      index.html auth.html dashboard.html \
                      home.html admin.html projects.html; do
            [ -e "$item" ] && cp -r "$item" www/
          done
          echo "=== www/ contents ==="
          ls -la www/

      # ── 5. Thêm platform iOS (tạo thư mục ios/ từ đầu) ──────────────────
      - name: Add iOS platform
        run: npx cap add ios

      # ── 6. Sync web assets vào project iOS ──────────────────────────────
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # ── 7. Cài CocoaPods dependencies ────────────────────────────────────
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      # ── 7b. Cài xcpretty để format log ──────────────────────────────────
      - name: Install xcpretty
        run: gem install xcpretty --no-document

      # ── 8. Build iOS .app (không ký certificate — ad-hoc sign sau) ──────
      - name: Build iOS (no code signing)
        run: |
          cd ios/App
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | xcpretty
          echo "=== Tìm .app sau build ==="
          find DerivedData -name "*.app" -type d 2>/dev/null

      # ── 8b. Ad-hoc sign — BẮT BUỘC để AltStore có thể re-sign ───────────
      #  CODE_SIGNING_ALLOWED=NO tạo binary không có _CodeSignature.
      #  AltStore (altserver) dùng codesign để replace chữ ký, nên cần
      #  ít nhất 1 ad-hoc signature (-) trước. codesign có sẵn trên macOS.
      - name: Ad-hoc sign for AltStore compatibility
        run: |
          APP_PATH=$(find ios/App/DerivedData -name "*.app" \
                     -path "*/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Không tìm thấy .app bundle — xodebuild có thể đã lỗi"
            exit 1
          fi
          echo "Signing: $APP_PATH"

          # Ký tất cả frameworks trước (thứ tự quan trọng)
          for fw in "$APP_PATH/Frameworks/"*.framework; do
            FW_NAME=$(basename "$fw" .framework)
            if [ -f "$fw/$FW_NAME" ]; then
              echo "  Signing framework: $FW_NAME"
              codesign --force --sign - "$fw" 2>&1
            fi
          done

          # Ký main app binary sau cùng (không truyền --entitlements vì /dev/null không đọc được)
          echo "  Signing main app binary"
          codesign --force --sign - "$APP_PATH" 2>&1

          echo "=== _CodeSignature ==="
          ls "$APP_PATH/_CodeSignature/" 2>/dev/null || echo "WARNING: _CodeSignature missing"

      # ── 9. Đóng gói .app thành .ipa ──────────────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH=$(find ios/App/DerivedData -name "*.app" \
                     -path "*/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Không tìm thấy .app bundle"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AIScreenplay.ipa Payload
          rm -rf Payload
          echo "=== IPA size ==="
          ls -lh AIScreenplay.ipa

      # ── 10. Upload artifact để download ──────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIScreenplay-iOS
          path: AIScreenplay.ipa
          retention-days: 30
